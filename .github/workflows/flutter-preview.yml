name: Flutter UI preview

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Generate missing Android embedding
        run: flutter create --platforms=android --project-name dailynotes .
      - name: Remove Flutter-generated demo test only
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Transaction and fault-injection tests
        run: flutter test test/local_journal_spike_test.dart
      - name: Widget tests
        run: flutter test test/app_navigation_test.dart
      - name: Debug preview APK (not a data-safe release)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: dailynotes-ui-preview-not-for-real-data
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
